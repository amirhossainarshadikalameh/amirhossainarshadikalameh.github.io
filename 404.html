<!doctype html>
<html lang="en">
<head>

  <style>
    :root { --bg: #070b16; --text: #e8eefb; --muted: #a3adc2; --accent: #7dd3fc; --accent-2: #a78bfa; --line: rgba(255,255,255,.11); color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f7fb; --text: #0f172a; --muted: #475569; --accent: #0369a1; --accent-2: #6d28d9; --line: rgba(15,23,42,.10); color-scheme: light; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text); text-align: center;
      background:
        radial-gradient(60vmax 40vmax at 10% -10%, rgba(56,189,248,.14), transparent 62%),
        radial-gradient(50vmax 40vmax at 100% 0%, rgba(139,92,246,.15), transparent 60%),
        var(--bg);
    }
    .code {
      margin: 0; font-size: clamp(4rem, 3rem + 6vw, 7rem); font-weight: 800; line-height: 1; letter-spacing: -.04em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 12px 0 6px; font-size: 1.4rem; }
    p { margin: 0; color: var(--muted); }
    a {
      display: inline-block; margin-top: 22px; padding: 9px 18px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600;
    }
    a:hover { border-color: var(--accent); }

</head>
